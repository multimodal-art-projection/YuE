[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-infer"
version = "0.1.6"
description = "YuE2 music generation with editable symbolic plans"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "MODEL_LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
    "torch==2.10.0; sys_platform != 'darwin'",
    "torch==2.14.1; sys_platform == 'darwin'",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "safetensors==0.7.0",
    "tiktoken==0.12.0",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "accelerate==1.13.0",
]

[project.optional-dependencies]
cuda = ["torch==2.10.0; sys_platform == 'linux'"]
xpu = ["torch==2.10.0+xpu; sys_platform == 'linux'", "triton-xpu==3.6.0; sys_platform == 'linux'"]
fast = ["vllm==0.19.0; sys_platform == 'linux'", "triton==3.6.0; sys_platform == 'linux'"]
test = ["pytest==9.0.3"]

[project.urls]
Repository = "https://github.com/multimodal-art-projection/YuE"
Demo = "https://map-yue2.github.io/"
Models = "https://huggingface.co/m-a-p/YuE2-3B"

[project.scripts]
yue2 = "yue2.cli:main"

[tool.uv]
conflicts = [
  [{ extra = "cuda" }, { extra = "xpu" }],
  # vllm and triton are NVIDIA-targeted; XPU vLLM runs from a dedicated
  # interpreter/venv (see #257), so the fast extra must not combine with xpu.
  [{ extra = "xpu" }, { extra = "fast" }],
]

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", extra = "xpu" }]
triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
